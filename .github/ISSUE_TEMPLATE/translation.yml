name: 翻訳の不備
description: 誤訳・不自然な訳・英語のまま・表示崩れなどを報告する
title: "[不備] "
labels: ["翻訳の不備"]
body:
  - type: markdown
    attributes:
      value: |
        スクリーンショットは、いちばん下の欄に画像を貼り付けるかドラッグしてください。
        終盤の内容のときは、タイトルに「ネタバレ」と入れてください。
  - type: dropdown
    id: story
    attributes:
      label: 物語
      options:
        - ソードランド（本編）
        - リジア（DLC）
        - メニュー・その他
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: どんな不備ですか
      options:
        - 誤訳（意味が違う）
        - 不自然な日本語
        - 英語のまま
        - 表示崩れ・文字化け
        - 用語の揺れ
        - 口調・呼びかけ
        - その他
    validations:
      required: true
  - type: input
    id: scene
    attributes:
      label: 場面
      placeholder: 例 1ターン目の経済会議／新聞／索引の人物の項目
  - type: textarea
    id: ja
    attributes:
      label: 画面に出ている日本語
      description: 該当する文をそのまま書き写してください（一部だけでも構いません）
    validations:
      required: true
  - type: textarea
    id: en
    attributes:
      label: 英語の原文（分かれば）
  - type: textarea
    id: note
    attributes:
      label: どう直すとよいか・気づいたこと
  - type: textarea
    id: shots
    attributes:
      label: スクリーンショット
      description: 画像をここに貼り付けてください
